name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC

permissions:
  contents: read

jobs:
  lint:
    name: Lint & validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: docker compose -f docker-compose.yml config --quiet

      - name: Check shell script syntax
        run: |
          for script in install.sh scripts/*.sh scripts/assistant; do
            echo "bash -n ${script}"
            bash -n "${script}"
          done

      - name: ShellCheck (errors only)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck -S error install.sh scripts/*.sh scripts/assistant

      - name: Check PowerShell installer syntax
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq powershell
          pwsh -NoProfile -Command '
            $tokens = $null; $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile(
              "install.ps1", [ref]$tokens, [ref]$errors)
            if ($errors.Count) { $errors | ForEach-Object { "PS: $($_.Message)" }; exit 1 }
            "install.ps1 syntax OK"
          '

      - name: Validate Python helpers
        run: |
          export PYTHONPYCACHEPREFIX=/tmp/ci-pycache
          python3 -m py_compile scripts/wdctl.py scripts/mcp-assistant.py
          echo "python helpers OK"

      - name: Installers must be LF (no CRLF — breaks bash/PowerShell on Windows)
        run: |
          ! grep -rlP '\r$' install.sh install.ps1 Makefile scripts/*.sh scripts/assistant scripts/wdctl.py scripts/mcp-assistant.py && echo "LF OK"

      - name: Installers --help exit cleanly
        run: |
          bash install.sh --help >/dev/null
          pwsh -NoProfile -Command '& ./install.ps1 -Help | Out-Null'
          echo "help OK"

      - name: Lint Dockerfile (hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error

  build-arm64:
    name: Build arm64 image
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
