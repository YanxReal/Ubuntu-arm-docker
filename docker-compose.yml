services:
  ubuntu-desktop:
    build:
      context: .
      args:
        UBUNTU_VERSION: ${UBUNTU_VERSION:-26.04}
        USERNAME: ${USERNAME:-admin}
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
        NODE_MAJOR: ${NODE_MAJOR:-24}
    image: ubuntu-desktop-cinnamon:${UBUNTU_VERSION:-26.04}
    platform: ${PLATFORM:-linux/arm64}
    container_name: ubuntu-desktop
    hostname: ubuntu-desktop
    shm_size: "2gb"
    restart: unless-stopped
    ports:
      - "${NOVNC_HOST_PORT:-6080}:6080"
      - "${VNC_HOST_PORT:-5902}:5900"
      - "${SSH_HOST_PORT:-2222}:22"
    environment:
      TZ: ${TZ:-UTC}
      LANG: ${LANG:-es_ES.UTF-8}
      RESOLUTION: ${RESOLUTION:-1920x1080}
      VNC_PASSWORD: ${VNC_PASSWORD:-admin}
      VNC_PORT: 5900
      NOVNC_PORT: 6080
      USERNAME: ${USERNAME:-admin}
      USER_UID: ${USER_UID:-1000}
      USER_GID: ${USER_GID:-1000}
    volumes:
      - ./workspace:/workspace
      - admin-home:/home/admin
      - ssh-host-keys:/var/lib/ssh

volumes:
  admin-home:
  ssh-host-keys:
